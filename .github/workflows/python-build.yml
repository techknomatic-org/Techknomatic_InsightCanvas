name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Frontend Dependencies
        run: yarn install --frozen-lockfile

      - name: Type Check Frontend (TypeScript)
        run: npx tsc --noEmit

      - name: Build Production Frontend Bundle
        run: yarn build

      - name: Sync Python Backend Dependencies
        run: uv sync --no-dev
